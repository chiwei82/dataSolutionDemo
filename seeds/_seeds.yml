seeds:
  - name: country_region
    description: Lookup from country code to city and region.
    config:
      column_types:
        country_code: string
        city: string
        region: string
    columns:
      - name: country_code
        description: Three-letter city/airport code used as the user's country.
        data_tests:
          - unique
          - not_null
      - name: city
        description: City name.
      - name: region
        description: '{{ doc("region") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Western_Europe', 'Eastern_Europe', 'Muslim_Majority_Europe']

  - name: product_category
    description: Lookup from traded product to its category.
    config:
      column_types:
        product: string
        product_display_name: string
        category: string
    columns:
      - name: product
        description: '{{ doc("product") }}'
        data_tests:
          - unique
          - not_null
      - name: product_display_name
        description: Product name as shown to clients, e.g. `EUR/USD`.
      - name: category
        description: '{{ doc("category") }}'
        data_tests:
          - not_null
