name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-ci
  cancel-in-progress: false

permissions:
  contents: read

env:
  DBT_VERSION: 2.0.6

jobs:
  build-and-test:
    name: dbt build (ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dbt Fusion
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update --version "$DBT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure dbt profile
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          keyfile="$RUNNER_TEMP/gcp_key.json"
          printf '%s' "$GCP_SA_KEY" > "$keyfile"
          echo "GCP_KEYFILE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "DBT_PROFILES_DIR=$GITHUB_WORKSPACE/ci" >> "$GITHUB_ENV"

      - name: Show dbt version
        run: dbt --version

      - name: Install packages
        run: dbt deps

      - name: Build and test
        run: dbt build --target ci
